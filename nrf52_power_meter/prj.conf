CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=2
# Name shown in Zwift and other apps when pairing.
CONFIG_BT_DEVICE_NAME="Garmin"
# 0x0484 = Cycling Power Sensor
CONFIG_BT_DEVICE_APPEARANCE=1156

CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Garmin"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="nrf52 power sim"

CONFIG_APP_UPHILL_CENTI_WKG=40
CONFIG_APP_WATTS=170
CONFIG_GPIO=y
CONFIG_LOG=y
