# Console over the nRF5340's native USB (CDC ACM), as in tms-fw
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y

# No bootloader on the EV board: link into the code partition from the overlay
CONFIG_USE_DT_CODE_PARTITION=y

# Buttons (gpio-keys on P1.08 / P1.09)
CONFIG_INPUT=y
